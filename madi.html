<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Madi</title>

    <!-- Fonte Inter do Google (Idêntica à referência, minimalista e limpa) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para Ícones (Instagram, TikTok) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #FAFAFA; /* Fundo geral levíssimo */
            --card-bg: #FFFFFF; /* Fundo dos botões 100% branco */
            --text-main: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cabeçalho de ponta a ponta (como na referência) */
        .header-cover {
            width: 100%;
            height: 220px;
            /* Imagem de fundo anexada */
            background-image: url('dolomitas.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Container do conteúdo que fica centralizado */
        .content-wrapper {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
        }

        /* Foto de perfil */
        .profile-pic {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: -70px; /* Sobrepõe exatamente metade no cabeçalho */
            border: 6px solid var(--bg-color); /* Borda da mesma cor do fundo para dar o recorte perfeito */
            background-color: var(--bg-color);
        }

        /* Título no mesmo formato "Nome | Subtítulo" */
        .name-title {
            margin-top: 25px;
            font-size: 1.6rem;
            font-weight: 400;
            color: var(--text-main);
            text-align: center;
            letter-spacing: -0.5px;
        }

        /* Ícones sociais alinhados e minimalistas */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .social-icons a {
            color: var(--text-main);
            font-size: 1.4rem;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .social-icons a:hover {
            opacity: 0.6;
        }

        /* Container da lista de links */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 50px;
        }

        /* Botão/Card do link - exato formato da referência */
        .link-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            text-decoration: none;
            color: var(--text-main);
            padding: 10px; /* Preenchimento pequeno em volta da imagem */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); /* Sombra super leve */
            border-radius: 2px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        /* Imagem quadrada (na frente, lado esquerdo) */
        .link-image {
            width: 75px;
            height: 75px;
            object-fit: cover;
            flex-shrink: 0;
            border-radius: 2px;
            background-color: #eaeaea;
        }

        /* Texto do link alinhado à esquerda e centralizado verticalmente */
        .link-text {
            margin-left: 24px; /* Distância exata da imagem */
            font-size: 1.05rem;
            font-weight: 400;
            text-align: left;
        }
    </style>
</head>

<body>

    <!-- Imagem de Capa -->
    <div class="header-cover"></div>

    <div class="content-wrapper">
        <!-- A foto de perfil na torre -->
        <img src="foto-perfil.jpg" alt="Minha foto de perfil" class="profile-pic">
        
        <!-- Título idêntico à estrutura "Nome | Subtítulo" -->
        <h1 class="name-title">Madi | Curadora de Viagens</h1>

        <!-- Ícones das Redes Sociais -->
        <div class="social-icons">
            <a href="https://www.instagram.com/pormadi/" target="_blank" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://www.tiktok.com/@por.madi" target="_blank" aria-label="TikTok">
                <i class="fab fa-tiktok"></i>
            </a>
        </div>

        <!-- Botões de Links (Cards brancos com foto quadrada na frente e texto à esquerda) -->
        <div class="links-container">
            
            <!-- Link 1 -->
            <a href="https://canva.link/b40c9k6qktk5w1s" class="link-card" target="_blank">
                <!-- Imagem Quadrada -->
                <img src="porto-galinhas.jpg" alt="Roteiro Porto de Galinhas" class="link-image">
                <span class="link-text">Template de Roteiro Porto de Galinhas - grátis</span>
            </a>

            <!-- Link 2 -->
            <a href="https://wa.me/44991393909" class="link-card" target="_blank">
                <!-- Imagem Quadrada -->
                <img src="fale-comigo.jpg" alt="Fale comigo" class="link-image">
                <span class="link-text">Fale comigo sobre sua viagem</span>
            </a>

        </div>
    </div>

</body>

</html>
